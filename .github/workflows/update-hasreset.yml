name: Update reset-today status

on:
  schedule:
    # GitHub does not guarantee schedule delivery. High load (especially near the
    # top of each hour) can delay runs by tens of minutes or drop them entirely.
    # Two off-hour slots are backups for the same UTC hour; the throttle step
    # below ensures at most one successful automated run per UTC hour.
    - cron: "13 * * * *"
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Redeploy GitHub Pages even if the monitor decided not to publish
        type: boolean
        default: true
  # Optional external keepalive (cron-job.org, etc.) when GitHub drops schedules:
  # POST /repos/{owner}/{repo}/dispatches  {"event_type":"update-hasreset"}
  repository_dispatch:
    types: [update-hasreset]

permissions:
  contents: read

concurrency:
  group: update-hasreset
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Discovery + optional schedule-reply pass + classification needs headroom.
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    # Use yes/no (not true/false). Values like "true" collide with secrets such as
    # GROK_USE_WS=true and get stripped from job outputs ("Skip output … secret").
    outputs:
      should_deploy: ${{ steps.decision.outputs.should_deploy }}
    steps:
      # Dual cron is for delivery redundancy, not double polling. Skip automated
      # triggers when this workflow already completed successfully earlier in the
      # same UTC hour. workflow_dispatch always proceeds. Failed first slots do
      # not count, so the :43 backup can still retry.
      - name: Limit automated runs to once per UTC hour
        id: throttle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch bypasses the hourly throttle."
            exit 0
          fi

          hour_start="$(date -u +%Y-%m-%dT%H:00:00Z)"
          echo "UTC hour window: ${hour_start} .. +1h (run_id=${RUN_ID})"

          set +e
          payload="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update-hasreset.yml/runs?per_page=30")"
          api_status=$?
          set -e

          if [[ "$api_status" -ne 0 || -z "$payload" ]]; then
            echo "::warning::Could not list prior workflow runs; continuing without throttle."
            echo "skip=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count="$(
            printf '%s' "$payload" | jq --arg start "$hour_start" --argjson me "$RUN_ID" '
              [
                .workflow_runs[]
                | select(.id != $me)
                | select(.status == "completed")
                | select(.conclusion == "success")
                | select(.run_started_at >= $start)
              ]
              | length
            '
          )"

          if [[ "$count" -gt 0 ]]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "Found ${count} successful run(s) already started this UTC hour — skipping."
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "No successful run yet this UTC hour — continuing."
          fi

      - uses: actions/checkout@v7
        if: steps.throttle.outputs.skip != 'yes'
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.throttle.outputs.skip != 'yes'
        with:
          node-version: "24"

      - name: Prepare Pages state
        id: paths
        if: steps.throttle.outputs.skip != 'yes'
        shell: bash
        run: |
          previous_dir="${RUNNER_TEMP}/hasreset-previous"
          output_dir="${RUNNER_TEMP}/hasreset-site"
          decision_file="${RUNNER_TEMP}/hasreset-decision.json"

          mkdir -p "$output_dir"
          set +e
          git ls-remote --exit-code --heads origin gh-pages \
            >"${RUNNER_TEMP}/hasreset-gh-pages-ref"
          remote_status=$?
          set -e

          case "$remote_status" in
            0)
              git fetch --no-tags --depth=1 origin \
                gh-pages:refs/remotes/origin/gh-pages
              git worktree add --detach "$previous_dir" \
                refs/remotes/origin/gh-pages
              ;;
            2)
              mkdir -p "$previous_dir"
              ;;
            *)
              echo "::error::Unable to inspect the gh-pages branch."
              exit 1
              ;;
          esac

          echo "previous_dir=$previous_dir" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "decision_file=$decision_file" >> "$GITHUB_OUTPUT"

      - name: Run reset monitor
        id: monitor
        if: steps.throttle.outputs.skip != 'yes'
        shell: bash
        env:
          GROK_API_BASE_URL: ${{ secrets.GROK_API_BASE_URL }}
          GROK_MODEL: ${{ secrets.GROK_MODEL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          # Optional. Prefer repository Variable over Secret (avoids masking "true").
          GROK_USE_WS: ${{ vars.GROK_USE_WS || secrets.GROK_USE_WS }}
        run: |
          set +e
          node api/hasreset/src/cli.mjs \
            --previous-dir "${{ steps.paths.outputs.previous_dir }}" \
            --output-dir "${{ steps.paths.outputs.output_dir }}" \
            --decision-file "${{ steps.paths.outputs.decision_file }}"
          monitor_exit_code=$?
          set -e
          echo "exit_code=$monitor_exit_code" >> "$GITHUB_OUTPUT"

      - name: Validate publish decision
        id: decision
        if: steps.throttle.outputs.skip != 'yes'
        shell: bash
        env:
          DECISION_FILE: ${{ steps.paths.outputs.decision_file }}
          MONITOR_EXIT_CODE: ${{ steps.monitor.outputs.exit_code }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy || false }}
        run: |
          test -f "$DECISION_FILE"

          publish="$(jq -er \
            '.publish | if type == "boolean" then tostring else error("publish must be boolean") end' \
            "$DECISION_FILE")"
          degraded="$(jq -er \
            '.degraded | if type == "boolean" then tostring else error("degraded must be boolean") end' \
            "$DECISION_FILE")"
          reason="$(jq -er '.reason' "$DECISION_FILE")"
          jq -e \
            'if (keys | sort) == ["degraded", "errorCode", "publish", "reason"] then true else error("unexpected decision fields") end' \
            "$DECISION_FILE" >/dev/null
          jq -e \
            '.errorCode | if . == null or type == "string" then true else error("errorCode must be a string or null") end' \
            "$DECISION_FILE" >/dev/null
          jq -e \
            '.reason | if type == "string" then true else error("reason must be a string") end' \
            "$DECISION_FILE" >/dev/null

          if [[ "$MONITOR_EXIT_CODE" == "0" && "$degraded" != "false" ]]; then
            echo "::error::The monitor returned success with a degraded decision."
            exit 1
          fi
          if [[ "$MONITOR_EXIT_CODE" == "2" && "$degraded" != "true" ]]; then
            echo "::error::The monitor returned a degraded exit without a degraded decision."
            exit 1
          fi
          if [[ "$MONITOR_EXIT_CODE" != "0" && "$MONITOR_EXIT_CODE" != "2" ]]; then
            echo "::error::The monitor returned an unexpected exit code."
            exit 1
          fi

          # Branch update only when the decision says so (semantic change / recovery / etc).
          if [[ "$publish" == "true" ]]; then
            echo "should_update_branch=yes" >> "$GITHUB_OUTPUT"
          else
            echo "should_update_branch=no" >> "$GITHUB_OUTPUT"
          fi

          # Pages is served from deploy-pages artifacts, not the gh-pages branch.
          # Redeploy when:
          # - the monitor asked to publish, or
          # - the check is healthy (so a prior missed deploy can self-heal), or
          # - the operator forced a manual redeploy.
          should_deploy=no
          if [[ "$publish" == "true" ]]; then
            should_deploy=yes
          elif [[ "$MONITOR_EXIT_CODE" == "0" ]]; then
            should_deploy=yes
          elif [[ "$FORCE_DEPLOY" == "true" ]]; then
            should_deploy=yes
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "decision_reason=$reason publish=$publish deploy=$should_deploy force=$FORCE_DEPLOY"

      - name: Validate generated site
        if: steps.throttle.outputs.skip != 'yes' && steps.decision.outputs.should_deploy == 'yes'
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.paths.outputs.output_dir }}
        run: |
          test -f "$OUTPUT_DIR/.nojekyll"
          test -f "$OUTPUT_DIR/favicon-16.png"
          test -f "$OUTPUT_DIR/favicon-32.png"
          test -f "$OUTPUT_DIR/index.html"
          test -f "$OUTPUT_DIR/app.js"
          test -f "$OUTPUT_DIR/l10n.js"
          test -f "$OUTPUT_DIR/status-logic.js"
          test -f "$OUTPUT_DIR/api/status.json"

      - name: Upload Pages artifact
        if: steps.throttle.outputs.skip != 'yes' && steps.decision.outputs.should_deploy == 'yes'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.paths.outputs.output_dir }}

      - name: Publish gh-pages state
        if: steps.throttle.outputs.skip != 'yes' && steps.decision.outputs.should_update_branch == 'yes'
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.paths.outputs.output_dir }}
        run: |
          publish_dir="${RUNNER_TEMP}/hasreset-publish"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages "$publish_dir" \
              refs/remotes/origin/gh-pages
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan gh-pages
          fi

          rsync -a --delete --exclude=".git" "$OUTPUT_DIR/" "$publish_dir/"
          git -C "$publish_dir" add --all

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "::error::The monitor requested publication without changing the site."
            exit 1
          fi

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" commit -m "chore(hasreset): publish status"
          git -C "$publish_dir" push origin gh-pages

  deploy:
    needs: monitor
    if: needs.monitor.outputs.should_deploy == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
