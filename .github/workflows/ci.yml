name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Test Swift
        run: swift test

  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Package ${{ matrix.arch }}
        env:
          EXPECTED_MACOS_SDK_MAJOR: "26"
          INCLUDE_WIDGET: "1"
          RUNWAY_BUNDLE_ID: com.github.codex-runway.dev
          RUNWAY_APP_GROUP_ID: group.com.github.codex-runway.dev
          RUNWAY_WIDGET_STORAGE_MODE: local
        run: ARCH=${{ matrix.arch }} bash Scripts/package-app.sh
      - name: Verify embedded widget ${{ matrix.arch }}
        run: bash Scripts/verify-packaged-app.sh dist/CodexRunway.app ${{ matrix.arch }} local
